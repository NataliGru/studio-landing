<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1d26" />

  <title>No Internet Connection | MNTN</title>

  <link rel="icon" type="image/ico" href="/public/offline/favicon.ico">
  <link rel="stylesheet" href="/offline/offline.css" />

</head>

<body>
  <main class="offline">
    <span class="offline__status">Offline</span>

    <h1 class="offline__title">Oops, connection lost</h1>
    
    <p class="offline__description">
      It looks like you’re offline. Check your internet connection and try again.
    </p>
    
    <button class="offline__button" type="button" onclick="window.location.reload()">
      Try again
    </button>
  </main>
</body>

</html>
